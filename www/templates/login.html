<!-- RF01 – login -->
<ion-view view-title="Login" hide-nav-bar="true">
  <ion-content class="login padding">
    <div class="limitar">

      <div class="login-logo">
        <i class="icon ion-university"></i>
        <h1>Portal do Aluno</h1>
        <p>Universidade Católica do Salvador</p>
      </div>

      <!-- ng-model liga cada campo com $scope.dados -->
      <div class="list">
        <label class="item item-input item-stacked-label">
          <span class="input-label">Matrícula</span>
          <input type="text" inputmode="numeric" placeholder="Ex.: 20261001" ng-model="dados.matricula">
        </label>
        <label class="item item-input item-stacked-label">
          <span class="input-label">Senha</span>
          <input type="password" placeholder="Sua senha" ng-model="dados.senha">
        </label>
      </div>

      <!-- só aparece quando tem erro -->
      <div class="card" ng-if="erro">
        <div class="item item-text-wrap assertive">
          <i class="icon ion-alert-circled"></i> {{ erro }}
        </div>
      </div>

      <button class="button button-block button-positive" ng-click="entrar()">Entrar</button>

      <p class="dica">Para testar: matrícula 20261001 e senha 123456</p>
    </div>
  </ion-content>
</ion-view>
